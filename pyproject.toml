[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agi-cognitive-runtime"
version = "0.1.0"
description = "A model-agnostic cognitive architecture for general-purpose AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "AGI Cognitive Runtime Contributors" }]
keywords = ["agi", "cognitive-architecture", "llm", "agent", "reasoning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "pyyaml>=6.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.0",
    "numpy>=1.24",
]
vector = [
    "lancedb>=0.4",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
all = [
    "agi-cognitive-runtime[embeddings,vector,dev]",
]

[project.scripts]
agi = "agi_runtime.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agi_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
